<line x1="480" y1="1200" x2="522" y2="1200" stroke="#edb773" stroke-width="2"/><text x="536" y="1207" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" fill="#edb773" >左瓣与内侧曲面控制柄</text>

<text x="1350" y="954" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#8eabbc" >错位留白</text>
<text x="1350" y="990" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#eef3f7" >由两条完整曲面共同围成</text>
<text x="1350" y="1025" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#8eabbc" >渐细缝隙与轮廓共同延展</text>

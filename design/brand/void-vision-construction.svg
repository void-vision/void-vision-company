<text x="1350" y="580" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#8eabbc" >左瓣 · 内侧曲面 · 外侧曲面</text>
<text x="1350" y="647" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#8eabbc" >曲线控制</text>
<text x="1350" y="683" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#eef3f7" >9 段三次贝塞尔曲线</text>
<text x="1350" y="716" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="19" fill="#8eabbc" >2 段圆弧保留中央圆形边界</text>
<text x="1350" y="783" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" font-size="17" fill="#8eabbc" >平滑连接</text>
